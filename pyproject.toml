[project]
name = "gdelt-lakehouse"
version = "0.1.0"
description = "Production-grade lakehouse pipeline for the GDELT 2.0 global events feed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhiram" }]

dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",          # retry with backoff for the flaky GDELT feed
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fsspec>=2024.6",         # storage abstraction: local + s3/minio
    "s3fs>=2024.6",
    "typer>=0.12",            # ingestion CLI
    "structlog>=24.1",        # structured JSON logging
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.1",
    "openlineage-python>=1.18",
]
stream = [
    "confluent-kafka>=2.5",
]
dbt = [
    "dbt-duckdb>=1.9",        # local gold: dbt models over the Iceberg silver table
    "duckdb>=1.4",            # reads the Iceberg REST catalog on MinIO
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",            # mock httpx for GDELT client tests
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "moto[s3]>=5.0",          # mock S3 for storage tests
]

[project.scripts]
gdelt = "gdelt_pipeline.ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdelt_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `from pyspark.sql import functions as F` is the universal PySpark idiom.
"spark/**/*.py" = ["N812"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship no type stubs (no py.typed marker).
module = ["fsspec", "fsspec.*", "s3fs", "s3fs.*", "confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=gdelt_pipeline --cov-report=term-missing"
pythonpath = ["src"]
