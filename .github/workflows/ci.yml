name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint , types , tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev tooling
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (strict types)
        run: mypy src

      - name: Pytest (unit tests + coverage)
        run: pytest

      - name: Validate docker-compose
        run: docker compose config --quiet

  terraform:
    # One job per cloud. Both stacks are validated on every push so the Azure
    # config cannot rot while the AWS one is the only side being exercised.
    name: terraform validate (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure]
    defaults:
      run:
        working-directory: terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
