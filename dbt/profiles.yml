# dbt-duckdb profile. The gold layer is built in DuckDB, reading the silver
# Iceberg table straight from the REST catalog on MinIO (proven bridge).
#
# Run from the dbt/ directory with:  dbt build --profiles-dir .
gdelt_gold:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'gold.duckdb') }}"
      threads: 4
      # httpfs = S3/MinIO access; iceberg = read the silver Iceberg tables.
      extensions:
        - httpfs
        - iceberg
      # Point DuckDB's S3 client at MinIO (path-style, plain HTTP).
      settings:
        s3_endpoint: "{{ env_var('GDELT_DUCKDB_S3_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('GDELT_S3_ACCESS_KEY', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('GDELT_S3_SECRET_KEY', 'minioadmin') }}"
        s3_url_style: path
        s3_use_ssl: false
      # Attach the Iceberg REST catalog as database "lake" (no auth locally).
      attach:
        - path: ""
          alias: lake
          type: iceberg
          options:
            endpoint: "{{ env_var('GDELT_ICEBERG_CATALOG_URI', 'http://localhost:8181') }}"
            authorization_type: none

    # AWS-style warehouse target. Builds the same gold models in BigQuery, reading
    # silver from a BigQuery dataset (loaded from the Iceberg table). Auth is OAuth
    # via `gcloud auth application-default login`. Run with: dbt build --target bq
    bq:
      type: bigquery
      method: oauth
      project: "{{ env_var('GDELT_BQ_PROJECT', 'final-project-478101') }}"
      dataset: "{{ env_var('GDELT_BQ_DATASET', 'gdelt_gold') }}"
      location: "{{ env_var('GDELT_BQ_LOCATION', 'US') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1

    # AWS warehouse target. Athena queries the same Glue/Iceberg silver table that
    # the Spark job writes, so gold is built in place with no data movement.
    # Run with: dbt build --target athena
    athena:
      type: athena
      s3_staging_dir: "{{ env_var('GDELT_ATHENA_STAGING') }}"
      s3_data_dir: "{{ env_var('GDELT_ATHENA_DATA') }}"
      region_name: "{{ env_var('GDELT_S3_REGION', 'us-east-2') }}"
      database: awsdatacatalog
      schema: "{{ env_var('GDELT_ATHENA_SCHEMA', 'gdelt_lakehouse_gold') }}"
      work_group: primary
      threads: 4

    # Azure warehouse target. A Databricks SQL warehouse queries the same Delta
    # silver table the PySpark job writes into Unity Catalog, so gold is built in
    # place with no data movement, the same arrangement as the Athena target.
    # Run with: dbt build --target databricks
    #
    # http_path names the SQL warehouse, not a cluster. A serverless SQL warehouse
    # is the right compute here: it starts in seconds and stops on its own, so an
    # idle project is not paying for a cluster somebody forgot to terminate.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('GDELT_DATABRICKS_CATALOG', 'gdelt_lakehouse') }}"
      schema: "{{ env_var('GDELT_DATABRICKS_SCHEMA', 'gold') }}"
      threads: 4
